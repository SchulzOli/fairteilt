name: Server-Image

# Builds the API image once in CI, so the server only pulls it (docs/BETRIEB.md). The server
# updates itself nightly from the tag `main`, so `main` is only published after a green CI run
# and only when the server code changed since the image that is out there now.
# Tags: main (newest), sha-<short> (every build, for going back), versions from v* tags.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: server-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/schulzoli/fairteilt-server
  # Everything that ends up in the image
  SERVER_PATHS: crates/core server Cargo.toml Cargo.lock deploy/Dockerfile .dockerignore

jobs:
  image:
    name: Build and push
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run: exactly the commit CI tested, not whatever main is now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - id: plan
        name: Anything new for the server?
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          tags="$IMAGE:sha-${sha:0:7}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tags="$tags,$IMAGE:${GITHUB_REF_NAME#v}"
          else
            tags="$tags,$IMAGE:main"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          build=true
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            prev=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '(if has("config") then . else .["linux/amd64"] end).config.Labels["org.opencontainers.image.revision"] // empty' || true)
            if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
              if git diff --quiet "$prev" HEAD -- $SERVER_PATHS; then
                echo "Server unchanged since ${prev:0:7}, the image stays as it is."
                build=false
              fi
              if ! git merge-base --is-ancestor "$prev" HEAD; then
                echo "Image ${prev:0:7} is not behind this commit (older CI run), skipping."
                build=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.title=fairteilt-server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.plan.outputs.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
