name: Server-Image

# Builds the API image once in CI, so the Hetzner server only pulls it (docs/BETRIEB.md).
# Tags: main (newest), sha-<short> (every build, for going back), v* for releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/core/**"
      - "server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fairteilt-server
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=fairteilt-server
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
