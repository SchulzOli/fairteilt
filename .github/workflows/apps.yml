# Store builds (M7). Runs by hand (Actions → Apps → Run workflow) and for version tags.
# Without the optional secrets it still builds: Android unsigned and without push, iOS for the
# simulator only. Secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON        content of google-services.json (Firebase, push)
#   ANDROID_KEYSTORE_BASE64     upload keystore, base64 (`base64 -w0 upload.jks`)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   FIREBASE_APP_DISTRIBUTION_KEY  service account JSON with the role "Firebase App Distribution
#                               Admin": the signed APK goes to App Distribution (docs/store/APP-DISTRIBUTION.md)
#   APPLE_DEVELOPMENT_TEAM      (later, for signed iOS builds)
# Every build gets its own versionCode (100000 + run number), so phones see it as an update.
name: Apps

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server, den die App ab Werk benutzt"
        default: "https://fairteilt.oli-tech.eu"
      distribute:
        description: "Android-APK an App Distribution schicken"
        type: boolean
        default: true
      groups:
        description: "Testergruppen in App Distribution (Aliase, durch Komma getrennt)"
        default: "familie"
      release_notes:
        description: "Versionshinweise (leer = letzte Commit-Nachricht)"
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VITE_SERVER_URL: ${{ inputs.server_url || 'https://fairteilt.oli-tech.eu' }}

jobs:
  android:
    name: Android (AAB + APK)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_DISTRIBUTION: ${{ secrets.FIREBASE_APP_DISTRIBUTION_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Version code
        run: echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Firebase config (optional)
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/src-tauri/gen/android/app/google-services.json
      - name: Upload key (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          pnpm --dir app tauri android build --aab --apk
          --config "{\"bundle\":{\"android\":{\"versionCode\":$VERSION_CODE}}}"
      - name: Send to App Distribution
        # Only a signed APK with push can be installed and updated on the phones.
        if: >-
          env.HAS_DISTRIBUTION == 'true' && env.HAS_KEYSTORE == 'true' && env.HAS_FIREBASE == 'true'
          && (github.event_name == 'push' || inputs.distribute)
        env:
          FIREBASE_APP_DISTRIBUTION_KEY: ${{ secrets.FIREBASE_APP_DISTRIBUTION_KEY }}
          GROUPS: ${{ inputs.groups || 'familie' }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          key="$RUNNER_TEMP/distribution-key.json"
          printf '%s' "$FIREBASE_APP_DISTRIBUTION_KEY" > "$key"
          app_id=$(jq -r '.client[] | select(.client_info.android_client_info.package_name == "eu.olitech.fairteilt") | .client_info.mobilesdk_app_id' app/src-tauri/gen/android/app/google-services.json)
          apk=$(ls app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n 1)
          notes=$(printf '%s\n\nBuild %s · %s · %s' "${NOTES:-$(git log -1 --format=%s)}" "$VERSION_CODE" "${GITHUB_SHA:0:7}" "$GITHUB_REF_NAME")
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx --yes firebase-tools@15.35.0 appdistribution:distribute "$apk" \
            --app "$app_id" --groups "$GROUPS" --release-notes "$notes"
      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/distribution-key.json" app/src-tauri/gen/android/app/google-services.json
      - uses: actions/upload-artifact@v5
        with:
          name: fairteilt-android
          path: |
            app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
            app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS (Simulator, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Generate the Xcode project
        run: |
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen
          pnpm --dir app tauri ios init --ci
      # No Apple account yet: `tauri ios build` needs some team ID to create its configuration,
      # and `--no-sign` builds without signing. The placeholder is never used for signing.
      # Runs beforeBuildCommand (frontend) and compiles the Rust part through Xcode.
      - name: Build for the simulator (unsigned)
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: pnpm --dir app tauri ios build --target aarch64-sim --debug --no-sign --ci
      - uses: actions/upload-artifact@v5
        with:
          name: fairteilt-ios-simulator
          path: app/src-tauri/gen/apple/build/*/*.app
          if-no-files-found: error
