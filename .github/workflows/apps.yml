# Store builds (M7). Runs by hand (Actions → Apps → Run workflow) and for version tags.
# Without the optional secrets it still builds: Android unsigned and without push, iOS for the
# simulator only. Secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON        content of google-services.json (Firebase, push)
#   ANDROID_KEYSTORE_BASE64     upload keystore, base64 (`base64 -w0 upload.jks`)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   APPLE_DEVELOPMENT_TEAM      (later, for signed iOS builds)
name: Apps

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server, den die App ab Werk benutzt"
        default: "https://fairteilt.oli-tech.eu"
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VITE_SERVER_URL: ${{ inputs.server_url || 'https://fairteilt.oli-tech.eu' }}

jobs:
  android:
    name: Android (AAB + APK)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Firebase config (optional)
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/src-tauri/gen/android/app/google-services.json
      - name: Upload key (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm --dir app tauri android build --aab --apk
      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" app/src-tauri/gen/android/app/google-services.json
      - uses: actions/upload-artifact@v5
        with:
          name: fairteilt-android
          path: |
            app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
            app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS (Simulator, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Generate the Xcode project
        run: |
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen
          pnpm --dir app tauri ios init --ci
      - name: Build for the simulator
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: pnpm --dir app tauri ios build --debug --target aarch64-sim --ci
      - uses: actions/upload-artifact@v5
        with:
          name: fairteilt-ios-simulator
          path: app/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
