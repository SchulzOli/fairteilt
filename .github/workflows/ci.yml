name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Frontend + Rust
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # ---------- Frontend ----------
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Type check (svelte-check)
        run: pnpm --dir app check
      - name: Build frontend (needed by the Tauri crate at compile time)
        run: pnpm --dir app build

      # ---------- Rust ----------
      - name: System libraries for Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all crates, warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: TypeScript types are up to date
        run: |
          cargo test -p punkte-core --features ts --locked export_bindings
          git diff --exit-code -- app/src/lib/generated
