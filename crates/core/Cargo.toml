[package]
name = "punkte-core"
description = "Domain types and pure point/settlement rules shared by server and app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
chrono-tz = "0.10.4"
serde.workspace = true
thiserror.workspace = true
ts-rs = { version = "12.0.1", features = ["uuid-impl", "chrono-impl"], optional = true }
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
# `cargo test -p punkte-core --features ts export_bindings` writes app/src/lib/generated/*.ts
ts = ["dep:ts-rs"]
