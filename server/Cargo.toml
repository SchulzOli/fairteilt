[package]
name = "punkte-server"
description = "HTTP API, scheduler and persistence for the household points system"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
punkte-core.workspace = true
rand = "0.10.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
