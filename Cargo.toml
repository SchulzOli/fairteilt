[workspace]
resolver = "3"
members = ["crates/core", "server", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
punkte-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

# Release profile for the Tauri app (profiles must live in the workspace root)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The server keeps panic=unwind so one failing request does not kill the process
[profile.release-server]
inherits = "release"
panic = "unwind"
lto = "thin"

# Password hashing is deliberately slow; keep it fast enough in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
