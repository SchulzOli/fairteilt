<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Android adaptive icon foreground: only the cookie, transparent around it.
       The launcher masks it (circle, squircle, ...) on top of android-bg.svg. Scaled to 72 %
       around the centre: the cookie stays inside the 66 dp safe zone, the crumbs inside the
       72 dp circle, and both keep their distance from the cookie as in app-icon.svg. -->
  <defs>
    <!-- used inside the scale(10.24) group, so coordinates are on the 0-100 grid -->
    <clipPath id="half-left"><path d="M0 0H55L47 26 57 42 44 58 53 74 44 100H0z"/></clipPath>
    <clipPath id="half-right"><path d="M55 0H100V100H44L53 74 44 58 57 42 47 26z"/></clipPath>
  </defs>
  <g transform="scale(10.24)">
    <g transform="translate(14 14) scale(0.72)">
      <g transform="translate(-4.5 1.5)">
        <g clip-path="url(#half-left)">
          <circle cx="50" cy="50" r="30" fill="#f4c246"/>
          <circle cx="50" cy="50" r="30" fill="none" stroke="#d99a1e" stroke-width="3"/>
          <circle cx="38" cy="38" r="3.6" fill="#5b3415"/>
          <circle cx="33" cy="56" r="3.2" fill="#5b3415"/>
          <circle cx="42" cy="69" r="3" fill="#5b3415"/>
        </g>
      </g>
      <g transform="translate(4.5 -1.5)">
        <g clip-path="url(#half-right)">
          <circle cx="50" cy="50" r="30" fill="#f4c246"/>
          <circle cx="50" cy="50" r="30" fill="none" stroke="#d99a1e" stroke-width="3"/>
          <circle cx="65" cy="38" r="3.4" fill="#5b3415"/>
          <circle cx="68" cy="57" r="3.2" fill="#5b3415"/>
          <circle cx="60" cy="68" r="2.8" fill="#5b3415"/>
        </g>
      </g>
      <circle cx="21" cy="81" r="2.6" fill="#f4c246"/>
      <circle cx="80" cy="20" r="2.2" fill="#f4c246"/>
    </g>
  </g>
</svg>
