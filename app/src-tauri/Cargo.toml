[package]
name = "fairteilt"
description = "Fairteilt – Tauri app (Android, iOS, Desktop)"
authors = ["SchulzOli"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix is necessary to keep the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "fairteilt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
punkte-core.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
