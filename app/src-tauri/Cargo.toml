[package]
name = "fairteilt"
description = "Fairteilt – Tauri app (Android, iOS, Desktop)"
authors = ["SchulzOli"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix is necessary to keep the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "fairteilt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
punkte-core.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Secure storage of the refresh token: OS keychain on desktop and iOS,
# app-private storage on Android (see src/secure_store.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }

# QR scanning for joining a household (phones only).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

