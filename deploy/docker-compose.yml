# Production stack, step by step in docs/BETRIEB.md.
#   cp .env.example .env   # fill in POSTGRES_PASSWORD, JWT_SECRET, API_IMAGE
#   ./update.sh
# Shared server with a central reverse proxy (default): the API listens on 127.0.0.1:API_PORT.
# Server for Fairteilt alone: COMPOSE_PROFILES=caddy starts the bundled Caddy on 80/443.
name: punkte

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: punkte
      POSTGRES_USER: punkte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
    volumes:
      - pgdata:/var/lib/postgresql   # Postgres 18 keeps its data in a versioned subfolder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U punkte -d punkte"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${API_IMAGE:-punkte-server:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://punkte:${POSTGRES_PASSWORD}@db:5432/punkte
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing in .env}
      # A reverse proxy sits in front: trust X-Forwarded-For for rate limiting
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://tauri.localhost,https://tauri.localhost,tauri://localhost}
      RUST_LOG: ${RUST_LOG:-punkte_server=info,tower_http=info}
      # Push over FCM: path of the Firebase service account inside the container (empty = no push)
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      # "Mit Google anmelden": OAuth web client ID(s), comma-separated (empty = off)
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
    ports:
      # Only reachable from this machine; the reverse proxy forwards to it
      - "127.0.0.1:${API_PORT:-8791}:8080"
    volumes:
      # Put firebase-service-account.json into deploy/secrets/ (never commit it)
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-fairteilt.oli-tech.eu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
