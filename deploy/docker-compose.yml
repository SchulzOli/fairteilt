# Production stack for the Hetzner server.
#   cp .env.example .env   # fill in DOMAIN and POSTGRES_PASSWORD
#   docker compose up -d --build
name: punkte

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: punkte
      POSTGRES_USER: punkte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
    volumes:
      - pgdata:/var/lib/postgresql   # Postgres 18 keeps its data in a versioned subfolder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U punkte -d punkte"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${API_IMAGE:-punkte-server:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://punkte:${POSTGRES_PASSWORD}@db:5432/punkte
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://tauri.localhost,https://tauri.localhost,tauri://localhost}
      RUST_LOG: ${RUST_LOG:-punkte_server=info,tower_http=info}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN missing in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
